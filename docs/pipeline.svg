<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1120" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1d1f24">Executive Productivity Agent — process flow</text>

  <!-- inputs -->
  <text x="24" y="66" font-size="11" font-weight="700" fill="#7b808b" letter-spacing="1">INPUTS</text>
  <g font-size="12.5" fill="#1d1f24">
    <rect x="24" y="76" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/><text x="36" y="95" font-weight="600">Meeting transcript</text><text x="36" y="110" font-size="11" fill="#6b7280">10 utterances</text>
    <rect x="24" y="126" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/><text x="36" y="145" font-weight="600">Email threads</text><text x="36" y="160" font-size="11" fill="#6b7280">5 subjects × 5 emails</text>
    <rect x="24" y="176" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/><text x="36" y="195" font-weight="600">Voice notes</text><text x="36" y="210" font-size="11" fill="#6b7280">2 (Arjun, to self)</text>
    <rect x="24" y="226" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/><text x="36" y="245" font-weight="600">Calendars</text><text x="36" y="260" font-size="11" fill="#6b7280">4 people, 34 entries</text>
  </g>
  <path d="M176 172 H206" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- stages -->
  <g font-size="12">
    <rect x="210" y="96" width="128" height="152" rx="10" fill="#e8ecfd" stroke="#2f4bd8"/>
    <text x="222" y="118" font-size="10.5" font-weight="700" fill="#2f4bd8">1 · INGEST</text>
    <text x="222" y="140" fill="#1d1f24">Normalise all</text><text x="222" y="156" fill="#1d1f24">sources → records</text><text x="222" y="178" fill="#1d1f24">Split into 71</text><text x="222" y="194" fill="#1d1f24">citable clauses</text><text x="222" y="216" fill="#6b7280" font-size="11">MTG1.U3#2, T1.E4…</text>

    <path d="M340 172 H362" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="366" y="96" width="140" height="152" rx="10" fill="#e8ecfd" stroke="#2f4bd8"/>
    <text x="378" y="118" font-size="10.5" font-weight="700" fill="#2f4bd8">2 · EXTRACT</text>
    <text x="378" y="140" fill="#1d1f24">Topic linking</text><text x="378" y="158" fill="#1d1f24">Speech acts</text><text x="378" y="176" fill="#1d1f24">People / addressee</text><text x="378" y="194" fill="#1d1f24">Deadline resolver</text><text x="378" y="216" fill="#6b7280" font-size="11">"tomorrow (Wed)</text><text x="378" y="230" fill="#6b7280" font-size="11">morning" → Wed 12:00</text>

    <path d="M508 172 H530" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="534" y="96" width="150" height="152" rx="10" fill="#e8ecfd" stroke="#2f4bd8"/>
    <text x="546" y="118" font-size="10.5" font-weight="700" fill="#2f4bd8">3 · REASON</text>
    <text x="546" y="140" fill="#1d1f24">Replay to "as of"</text><text x="546" y="158" fill="#1d1f24">Merge by (topic,</text><text x="546" y="174" fill="#1d1f24">owner, kind)</text><text x="546" y="192" fill="#1d1f24">Status, date changes,</text><text x="546" y="208" fill="#1d1f24">chasers, delivery,</text><text x="546" y="224" fill="#1d1f24">stale notes</text>

    <path d="M686 172 H708" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="712" y="96" width="140" height="152" rx="10" fill="#e8ecfd" stroke="#2f4bd8"/>
    <text x="724" y="118" font-size="10.5" font-weight="700" fill="#2f4bd8">4 · CHECK</text>
    <text x="724" y="140" fill="#1d1f24">Calendar clashes</text><text x="724" y="158" fill="#1d1f24">Missing entries</text><text x="724" y="176" fill="#1d1f24">Unowned work</text><text x="724" y="194" fill="#1d1f24">At-risk delivery</text><text x="724" y="212" fill="#1d1f24">Replies owed</text>
  </g>
  <path d="M854 172 H884" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- outputs -->
  <text x="888" y="66" font-size="11" font-weight="700" fill="#7b808b" letter-spacing="1">OUTPUTS</text>
  <g font-size="12.5" fill="#1d1f24">
    <rect x="888" y="76" width="208" height="42" rx="8" fill="#e5f4ec" stroke="#217a4b"/><text x="900" y="95" font-weight="600">Daily brief</text><text x="900" y="110" font-size="11" fill="#6b7280">priorities · annotated calendar</text>
    <rect x="888" y="126" width="208" height="42" rx="8" fill="#e5f4ec" stroke="#217a4b"/><text x="900" y="145" font-weight="600">Commitment register</text><text x="900" y="160" font-size="11" fill="#6b7280">mine · waiting · needs an owner</text>
    <rect x="888" y="176" width="208" height="42" rx="8" fill="#e5f4ec" stroke="#217a4b"/><text x="900" y="195" font-weight="600">Flags</text><text x="900" y="210" font-size="11" fill="#6b7280">every flag cites its sources</text>
    <rect x="888" y="226" width="208" height="42" rx="8" fill="#e5f4ec" stroke="#217a4b"/><text x="900" y="245" font-weight="600">Q&amp;A</text><text x="900" y="260" font-size="11" fill="#6b7280">"What did I promise Raghav?"</text>
  </g>

  <!-- LLM layer -->
  <rect x="366" y="292" width="486" height="78" rx="10" fill="#fdf2df" stroke="#b26a00" stroke-dasharray="5 4"/>
  <text x="380" y="314" font-size="10.5" font-weight="700" fill="#b26a00">OPTIONAL · CLAUDE TOOL-USE AGENT (claude-opus-5)</text>
  <text x="380" y="334" font-size="12" fill="#1d1f24">Free-form questions → Claude calls tools: get_daily_brief · list_commitments ·</text>
  <text x="380" y="350" font-size="12" fill="#1d1f24">get_commitment · get_calendar · list_flags · search_sources → answers with [source ids]</text>
  <path d="M610 292 V250" stroke="#b26a00" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M852 330 H992 V270" stroke="#b26a00" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="24" y="330" font-size="11.5" fill="#6b7280">Deterministic core: runs offline, in the</text>
  <text x="24" y="346" font-size="11.5" fill="#6b7280">browser or Node, no API key needed.</text>
  <text x="24" y="362" font-size="11.5" fill="#6b7280">Same engine is the LLM's only source of truth.</text>
</svg>
